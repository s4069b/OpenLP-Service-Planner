<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SongSelect → OpenLP Settings</title>
<style>
body{font:14px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f4f5f5;color:#263746}
main{max-width:680px;margin:32px auto;padding:22px;background:white;border:1px solid #d9dfe3;border-radius:14px}
h1{font-size:21px;margin:0 0 8px}p{color:#60717e}label{display:block;font-weight:700;margin:18px 0 5px}
input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #aebac3;border-radius:8px;font:inherit}
.actions{display:flex;gap:8px;margin-top:14px}button{padding:9px 13px;border-radius:8px;border:1px solid #4f677a;background:#edf3f7;color:#20384c;font-weight:700;cursor:pointer}
button.primary{background:#314d63;color:white}.status{min-height:22px;margin-top:10px;font-weight:700}.note{font-size:12px}
code{background:#eef1f3;padding:1px 4px;border-radius:4px}
</style>
</head>
<body>
<main>
<h1>SongSelect → OpenLP Service Planner</h1>
<p>Set the address of the Planner installation that should receive SongSelect songs.</p>
<label for="plannerUrl">Planner URL</label>
<input id="plannerUrl" type="url" placeholder="https://openlp-service-planner.example.org/">
<p class="note">The extension requests access only to this Planner site and to <code>songselect.ccli.com</code>. Changing the URL will ask for permission to the new site.</p>
<div class="actions"><button id="reset">Clear</button><button class="primary" id="save">Save</button></div>
<div class="status" id="status"></div>
<p class="note" id="permissionStatus"></p>
</main>
<script src="options.js"></script>
</body>
</html>
