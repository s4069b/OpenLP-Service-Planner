name = "openlp-service-planner"
main = "src/worker.ts"
compatibility_date = "2026-08-13"
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "openlp-service-planner"
database_id = "00000000-0000-0000-0000-000000000000" # replace before deployment
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "openlp-service-planner-media" # change if your deployment uses another bucket name
